# Completeness verdict of the DRY RUN: the subtrees the scan could never walk, so
# the report an administrator is about to publish is a partial picture of the tree.
# The counts are rendered by <number-format>, never by these sentences
cleanup.admin.scanFailures.headline=folder(s) could not be scanned
cleanup.admin.scanFailures.warning=The report below does not cover them: their files were never evaluated, so they are missing from the candidates and will not be deleted. Fix the cause and start a new campaign to cover them.
cleanup.admin.scanFailures.notWalked=Not scanned
cleanup.admin.scanFailures.loadError=Error while loading the folders this campaign could not scan
# Per-SUBTREE dry-run failure reason, grouped by the scan-failures endpoint. Same
# contract as the execution codes below: a lowercase fragment rendered inside a
# sentence, and never a raw exception message
cleanup.scanUnitFailed=this folder could not be read by the repository, and three scan attempts all failed on it
# Per-item EXECUTION failure reasons: the message codes the purge stores on an
# item, which the failures endpoint groups by. Rendered INSIDE a sentence (the
# state chip tooltip, the grouped failures block), hence the lowercase register,
# and each one tells the administrator whether another attempt can help
cleanup.referentialIntegrity=another document still references this file, so deleting it would break that reference: the reference has to be removed first, another attempt alone will fail the same way
cleanup.deleteError=the repository refused to delete this file, which can be temporary: another attempt can help
cleanup.purgeVersionsError=the old versions of this file could not be purged, which can be temporary: another attempt can help
cleanup.notVersionable=this file carries no version history, so there is nothing to purge and another attempt would skip it again
cleanup.noVersionHistory=this file is marked versionable but was never checked in, so it has no version to trim and another attempt would skip it again
cleanup.revalidationFailed=this file could not be checked against the campaign rules right before its deletion, which can be temporary: another attempt can help
cleanup.unexpectedError=an unexpected error occurred, which can be temporary: another attempt can help
